name: Deploy Node.js Docker App to Azure

on:
  push:                    # ← Runs immediately on push to ANY branch
    branches: [ '**' ]     # This includes feature branches, main, develop, etc.
  pull_request:            # ← Still runs on PRs for extra validation
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  security-check:
    name: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'   # Only on PRs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code Security Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          path_to_claude_code_executable: /usr/local/bin/claude
          prompt: |
            You are a senior application security engineer auditing this Node.js + Docker project.

            Review ALL source files in the repository for security issues... (your original prompt)

            When done, write your final verdict to the file $GITHUB_WORKSPACE/security-verdict.txt
            containing exactly one of these two lines...

      - name: Display Claude Security Report
        run: |
          echo "=== CLAUDE SECURITY REPORT ==="
          cat $GITHUB_WORKSPACE/security-verdict.txt 2>/dev/null || echo "No verdict file found"
          echo "=============================="

      - name: Fail if critical issues found
        run: |
          verdict=$(cat $GITHUB_WORKSPACE/security-verdict.txt 2>/dev/null || echo "NO OUTPUT")
          if echo "$verdict" | grep -qi "SECURITY REVIEW FAILED"; then
            echo "❌ Security review FAILED"
            exit 1
          else
            echo "✅ Security review PASSED"
          fi
        shell: bash

  build-and-deploy:
    name: build-and-deploy
    needs: security-check
    runs-on: ubuntu-latest
    # Run on direct push (feature branch or main) or manual trigger
    # Skip if security-check failed on a PR
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.security-check.result == 'success' || needs.security-check.result == 'skipped')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'

      - name: Deployment Summary
        run: echo "✅ Deployment completed successfully to ${{ github.ref }}!"