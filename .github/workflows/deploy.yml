name: Deploy Node.js Docker App to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Security Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_app_token: false        # This helps avoid the workflow validation error
          show_full_output: true
          prompt: |
            You are a senior application security engineer performing a security audit on this Node.js + Docker project.

            Focus especially on any changes introduced in this pull request.

            Scan for:
            - Vulnerable npm dependencies (check package.json and package-lock.json)
            - Command injection, XSS, prototype pollution, insecure deserialization
            - Hardcoded secrets, API keys or credentials
            - Docker security issues (unsafe base images, running as root, exposed ports, etc.)
            - Weak input validation or authentication flaws

            For each finding, clearly state:
            - Severity: Critical / High / Medium / Low
            - File and line if possible
            - Risk explanation
            - How to fix it

            At the very end of your response, output exactly one of these two lines:

            SECURITY REVIEW PASSED

            or

            SECURITY REVIEW FAILED - CRITICAL OR HIGH SEVERITY ISSUES FOUND

      - name: Display Claude Security Report
        run: |
          echo "=== CLAUDE SECURITY REPORT ==="
          echo "${{ steps.claude.outputs.result || 'No output received from Claude' }}"
          echo "=============================="

      - name: Fail if critical issues found
        run: |
          if echo "${{ steps.claude.outputs.result }}" | grep -qi "SECURITY REVIEW FAILED"; then
            echo "❌ Security review FAILED - Critical or High issues detected"
            exit 1
          else
            echo "✅ Security review PASSED"
          fi
        shell: bash

  build-and-deploy:
    needs: security-check
    # Runs when code is pushed to main (including after PR merge)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'

      - name: Deployment Summary
        run: echo "✅ Successfully deployed to Azure App Service"