name: Deploy Node.js Docker App to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  security-check:
    name: security-check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Security Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_app_token: false
          show_full_output: true
          prompt: |
            You are a senior application security engineer auditing this Node.js + Docker project.

            Focus especially on changes in this pull request.

            At the very end, output exactly one of these two lines:

            SECURITY REVIEW PASSED

            or

            SECURITY REVIEW FAILED - CRITICAL OR HIGH SEVERITY ISSUES FOUND

      - name: Display Claude Security Report
        run: |
          echo "=== CLAUDE SECURITY REPORT ==="
          echo "${{ steps.claude.outputs.result || 'No output' }}"
          echo "=============================="

      - name: Fail if critical issues found
        run: |
          if echo "${{ steps.claude.outputs.result }}" | grep -qi "SECURITY REVIEW FAILED"; then
            echo "❌ Security review FAILED"
            exit 1
          else
            echo "✅ Security review PASSED"
          fi
        shell: bash

  build-and-deploy:
    name: build-and-deploy
    needs: security-check
    # Only run on actual push to main (after merge) or manual trigger
    # This prevents running on PRs where OIDC often fails
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'

      - name: Deployment Summary
        run: echo "✅ Deployment completed successfully!"