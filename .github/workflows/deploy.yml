name: Deploy Node.js Docker App to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  security-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Security Review
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: |
            You are a senior application security engineer performing a thorough security audit on this Node.js + Docker project.

            Focus especially on the changes introduced in this pull request.

            Scan carefully for the following:
            - Vulnerable or outdated npm dependencies (check package.json and package-lock.json)
            - Command injection, XSS, prototype pollution, insecure deserialization
            - Hardcoded secrets, API keys, or sensitive credentials
            - Docker/container security issues (unsafe base images, running as root, exposed ports, etc.)
            - Weak input validation, authentication/authorization flaws
            - Any other high or critical security risks

            For every finding, clearly include:
            - Severity: Critical / High / Medium / Low
            - File and line number (if possible)
            - Brief explanation of the risk
            - Recommended fix

            At the **very end** of your entire response, you must output exactly one of these two lines and nothing else after it:

            SECURITY REVIEW PASSED

            or

            SECURITY REVIEW FAILED - CRITICAL OR HIGH SEVERITY ISSUES FOUND

      - name: Display Claude Security Report
        run: |
          echo "=== CLAUDE SECURITY REPORT ==="
          echo "${{ steps.claude.outputs.result || 'No output received from Claude' }}"
          echo "=============================="

      - name: Fail if critical security issues found
        run: |
          if echo "${{ steps.claude.outputs.result }}" | grep -qi "SECURITY REVIEW FAILED"; then
            echo "❌ Security review FAILED - Critical or High severity issues detected."
            exit 1
          else
            echo "✅ Security review PASSED (no critical or high severity issues found)."
          fi
        shell: bash

  build-and-deploy:
    needs: security-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'