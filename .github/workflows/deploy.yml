name: Deploy Node.js Docker App to Azure

on:
  push:
    branches:
      - main
  pull_request:          # ← Added this
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write   # Needed for Claude to comment on PRs

jobs:
  # Security check - now runs on PRs (and can optionally run on push to main)
  security-check:
    runs-on: ubuntu-latest
    # Only run security check on PRs (recommended) or on push to main
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a senior application security engineer. Perform a focused security audit on this codebase, with emphasis on the changes in this pull request (if any).

            Look specifically for:
            - Known vulnerable dependencies (check package.json / package-lock.json)
            - Node.js security anti-patterns (command injection, XSS, insecure random, prototype pollution, etc.)
            - Hardcoded credentials or secrets
            - Docker security issues (base image, exposed ports, permissions)
            - Input validation weaknesses
            - Any other high/critical severity risks

            For every finding, provide:
            1. Severity (Critical / High / Medium / Low)
            2. File and line (if possible)
            3. Clear explanation of the risk
            4. Recommended fix

            At the very end of your response, output exactly one of these two lines:
            SECURITY REVIEW PASSED
            or
            SECURITY REVIEW FAILED - CRITICAL/HIGH ISSUES FOUND

      - name: Fail job if critical issues found
        run: |
          if grep -qi "SECURITY REVIEW FAILED" claude-output.txt 2>/dev/null || [ ! -f claude-output.txt ]; then
            echo "❌ Security review failed due to critical or high severity issues."
            exit 1
          else
            echo "✅ Security review passed."
          fi
        shell: bash

  # Deploy job only runs after successful security check (and only on push to main)
  build-and-deploy:
    needs: security-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # Only deploy on push to main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'