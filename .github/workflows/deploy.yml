name: Test ACR Push with OIDC

on:
  workflow_dispatch:     # Run manually only

permissions:
  contents: read
  id-token: write

jobs:
  test-acr-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: nodeoidcdemoacr.azurecr.io

      - name: Build and push test image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: nodeoidcdemoacr.azurecr.io/test-image:latest