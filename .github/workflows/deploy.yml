name: Deploy Node.js Docker App to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # OIDC Login to Azure
      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Login to ACR using OIDC (Correct way)
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: nodeoidcdemoacr.azurecr.io

      # Build and push Docker image
      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      # Deploy to Azure App Service
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}'