name: Deploy Node.js Docker App to Azure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write   # Allows Claude to comment on PRs

jobs:
  security-check:
    runs-on: ubuntu-latest
    # Run security check ONLY on pull requests (this avoids the push error)
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Security Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are a senior security engineer performing a security audit on this Node.js + Docker codebase.

            Focus especially on any changes in this pull request.

            Check for:
            - Vulnerable npm dependencies
            - Command injection, XSS, prototype pollution, insecure deserialization
            - Hardcoded secrets or credentials
            - Docker security issues (base image, permissions, exposed ports)
            - Weak input validation or authentication flaws

            For each issue found, give:
            - Severity (Critical / High / Medium / Low)
            - File and line number if possible
            - Risk explanation
            - How to fix it

            At the end, output exactly one line:
            SECURITY REVIEW PASSED
            or
            SECURITY REVIEW FAILED - CRITICAL/HIGH ISSUES FOUND

      - name: Fail if critical security issues found
        run: |
          if grep -qi "SECURITY REVIEW FAILED" claude-output.txt 2>/dev/null || [ ! -f claude-output.txt ]; then
            echo "❌ Security review failed."
            exit 1
          else
            echo "✅ Security review passed."
          fi
        shell: bash

  build-and-deploy:
    # Deploy only happens on push to main (after security check passes on PRs)
    needs: security-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name nodeoidcdemoacr

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            nodeoidcdemoacr.azurecr.io/node-docker-demo:${{ github.sha }}
            nodeoidcdemoacr.azurecr.io/node-docker-demo:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'node-docker-demo-app'
          slot-name: 'Production'
          images: 'nodeoidcdemoacr.azurecr.io/node-docker-demo:latest'